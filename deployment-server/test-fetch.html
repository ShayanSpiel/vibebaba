<!DOCTYPE html>
<html>
<head>
    <title>PocketBase Fetch Test</title>
</head>
<body>
    <h1>PocketBase Connection Test</h1>
    <button onclick="testFetch()">Test Fetch</button>
    <pre id="output"></pre>

    <script>
        async function testFetch() {
            const output = document.getElementById('output');
            output.textContent = 'Testing...';

            try {
                const startTime = Date.now();
                const response = await fetch('http://localhost:8090/api/collections/LsZbK8I9FB8TGPa_products/records', {
                    method: 'GET',
                    credentials: 'include'
                });
                const endTime = Date.now();

                output.textContent = `Success!\n`;
                output.textContent += `Time: ${endTime - startTime}ms\n`;
                output.textContent += `Status: ${response.status}\n`;
                output.textContent += `Headers:\n${JSON.stringify([...response.headers.entries()], null, 2)}\n\n`;

                const data = await response.json();
                output.textContent += `Data:\n${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                output.textContent = `Error: ${error.message}\n${error.stack}`;
            }
        }
    </script>
</body>
</html>
