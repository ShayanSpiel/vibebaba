# Vibebaba Nginx Configuration
# Handles wildcard subdomains and custom domains

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# HTTP (Port 80) - Redirect to HTTPS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
server {
    listen 80;
    listen [::]:80;
    server_name *.vibebaba.com vibebaba.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# HTTPS (Port 443) - Main Configuration
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.vibebaba.com vibebaba.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/vibebaba.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibebaba.com/privkey.pem;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (Optional - enables HTTPS strict transport security)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy Settings
    location / {
        proxy_pass http://localhost:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Logging
    access_log /var/log/nginx/vibebaba_access.log;
    error_log /var/log/nginx/vibebaba_error.log;
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SETUP INSTRUCTIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# 1. Install Nginx:
#    sudo apt update
#    sudo apt install nginx
#
# 2. Copy this file to Nginx sites-available:
#    sudo cp vibebaba.conf /etc/nginx/sites-available/vibebaba
#
# 3. Enable the site:
#    sudo ln -s /etc/nginx/sites-available/vibebaba /etc/nginx/sites-enabled/
#
# 4. Remove default site (optional):
#    sudo rm /etc/nginx/sites-enabled/default
#
# 5. Install Certbot for SSL:
#    sudo apt install certbot python3-certbot-nginx
#
# 6. Get wildcard SSL certificate (requires DNS challenge):
#    sudo certbot certonly --manual --preferred-challenges dns \
#      -d vibebaba.com -d *.vibebaba.com
#
#    NOTE: You will need to add TXT records to your DNS:
#    - Name: _acme-challenge.vibebaba.com
#    - Type: TXT
#    - Value: [value provided by certbot]
#
# 7. Test Nginx configuration:
#    sudo nginx -t
#
# 8. Reload Nginx:
#    sudo systemctl reload nginx
#
# 9. Setup auto-renewal (add to crontab):
#    sudo crontab -e
#    # Add this line:
#    0 0 * * * certbot renew --quiet && systemctl reload nginx
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# DNS CONFIGURATION (Required)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# Add these DNS records to your domain:
#
# For vibebaba.com:
# A      @              [YOUR_SERVER_IP]
# A      *              [YOUR_SERVER_IP]     # Wildcard for subdomains
# CNAME  www            vibebaba.com
#
# For custom domains (users add these):
# A      @              [YOUR_SERVER_IP]
# CNAME  www            vibebaba.com
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
